<ion-header class="ion-no-border"/>

<ion-toolbar>
    <ion-avatar slot="start">
        <img src="assets/img/AmongUs.jpg" alt="">
    </ion-avatar>
    <ion-title>Materials</ion-title>
</ion-toolbar>

<ion-content [fullscreen]="true">
    <div class="ion-text-center">
        <ion-button id="abrir-modal">
            <ion-icon name="power"></ion-icon>
        </ion-button>
    </div>

    <ion-list>
        @for (material of dataZelda(); track material.id){
            <ion-item>
                <ion-avatar slot="end">
                    <<img [src]="dataZelda" alt="">
                </ion-avatar>
            </ion-item>
        }
    </ion-list>
</ion-content>
