<ion-content class="ion-padding">
  <swiper-container>
    @for (slide of slides; track $index){
      <swiper-slide class="slide-full">
        <ion-card class="slide-card">
          <ion-img [src]="slide.img" alt="..." class="slide-image"></ion-img>
          <ion-card-content class="ion-text-center">
            <ion-label [color]="slide.color">{{slide.desc}}</ion-label>
          </ion-card-content>
          @if ($last) {
            <ion-button class="ion-display-flex ion-align-items-center" color="success">
              Empezar
            </ion-button>
          }
        </ion-card>
      </swiper-slide>
    }
  </swiper-container>
</ion-content>
